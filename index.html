<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARTINS BURGUER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a class="ini" href="#">INICIO</a>

    <h3>BURGUERS MASTER</h3>

    <section class="whatCompra">
      <a id="whatsapp" href="https://wa.me/5519996894181" target="_blank">
        <img class="whatsapp" src="img/whatsapp.png" alt="WhatsApp">
      </a>

      <a id="carrinho">
        <img
          class="whatsapp"
          src="img/carrinho-de-compras.png"
          alt="Carrinho"
        >
      </a>
    </section>
  </header>

  <div class="lista" style="display: none;">
    <section class="mpd">
      <h1>MEUS PEDIDOS</h1>
      <button class="btnxx"><img class="btnX" id="x" src="img/botao-x.png" alt="Fechar"></button>
    </section>

    <div id="itens"></div>

    <div class="campo-regiao">
      <label for="select-regiao">📍 Selecione a Região de Entrega:</label>
      <select id="select-regiao">
        <option value="" disabled selected>-- Escolha sua Região --</option>
        <option value="0" data-nome="Retirar no Balcão">Retirar no estabelecimento (R$ 0,00)</option>
        <option value="5" data-nome="Serra Italiana">Serra Italiana (R$ 5,00)</option>
        <option value="15" data-nome="Ninho Verde">Ninho Verde (R$ 15,00)</option>
        <option value="10" data-nome="Maristela">Maristela (R$ 10,00)</option>
        <option value="15" data-nome="Pardinho">Pardinho (R$ 15,00)</option>
      </select>
    </div>

    <h2 id="total-carrinho">Total: R$ 0.00</h2>

    <button class="finalizar">
      ENVIAR PEDIDO VIA WHATSAPP
    </button>
  </div>

  <main>
    <section id="lanches" class="comidas osDois"></section>
  </main>

  <div id="modal-obs" class="modal" style="display: none;">
    <div class="modal-conteudo">
      <h3>Deseja adicionar alguma observação?</h3>
      <p>Ex: Sem cebola, molho à parte, ponto da carne, etc.</p>
      
      <textarea id="campo-obs" placeholder="Digite sua observação aqui..."></textarea>
      
      <div class="modal-botoes">
        <button id="btn-sem-obs">Sem Observação</button>
        <button id="btn-com-obs">Adicionar</button>
      </div>
    </div>
  </div>

  <div id="modal-pix" class="modal" style="display: none;">
    <div class="modal-conteudo pix-box">
      <h3>Pagamento via Pix</h3>
      <p class="pix-sub">Escaneie o QR Code ou copie o código abaixo para pagar:</p>
      
      <div class="qr-code-container">
        <img id="img-qrcode" src="" alt="Carregando QR Code...">
      </div>
      
      <div class="valor-pix-destaque">
        Total: <span id="valor-pix-modal">R$ 0,00</span>
      </div>

      <textarea id="texto-pix-copia" readonly style="position: absolute; left: -9999px;"></textarea>
      
      <button id="btn-copiar-pix" class="btn-pix-acao">📋 Copiar Código Pix</button>
      <div id="aviso-copiado" style="display: none; color: #2ecc71; font-weight: bold; margin-top: 8px; font-size: 0.9rem;">Código copiado com sucesso!</div>

      <div class="status-pagamento">
        <div class="spinner"></div>
        <span>Aguardando aprovação do banco...</span>
      </div>
      
      <button id="btn-cancelar-pix" class="btn-pix-cancelar">Cancelar Pedido</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
